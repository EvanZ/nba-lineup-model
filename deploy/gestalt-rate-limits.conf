# This file is included from nginx.conf's http block via /etc/nginx/conf.d/*.conf.
# Keys are client IPs. 10 MiB per zone is ample for a small public beta.
limit_req_zone $binary_remote_addr zone=gestalt_api_general:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=gestalt_api_matchups:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=gestalt_api_connections:10m;
