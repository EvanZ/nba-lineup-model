server {
    server_name gestalt-dev.toplines.app;

    root /var/www/nba-gestalt-dev;
    index index.html;

    auth_basic "NBA GESTALT development";
    auth_basic_user_file /etc/nginx/gestalt-dev.htpasswd;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    limit_req_status 429;
    limit_conn_status 429;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ^~ /api/headshots/ {
        limit_conn gestalt_api_connections 20;
        proxy_pass http://127.0.0.1:8011;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=gestalt_api_general burst=30 nodelay;
        limit_conn gestalt_api_connections 20;
        proxy_pass http://127.0.0.1:8011;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/matchups {
        limit_req zone=gestalt_api_matchups burst=10 nodelay;
        limit_conn gestalt_api_connections 8;
        proxy_pass http://127.0.0.1:8011;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml application/font-woff application/font-woff2;

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/gestalt-dev.toplines.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gestalt-dev.toplines.app/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name gestalt-dev.toplines.app;
    return 301 https://$host$request_uri;
}
