server {
    listen 80;
    server_name gestalt.toplines.app;

    root /var/www/nba-gestalt;
    index index.html;

    limit_req_status 429;
    limit_conn_status 429;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Player images are browser assets, not API actions. Keep their burst from
    # consuming the per-IP budget needed by rankings and other JSON endpoints.
    location ^~ /api/headshots/ {
        limit_conn gestalt_api_connections 20;
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Normal UI navigation can search as the user types, so it gets a wider limit.
    location /api/ {
        limit_req zone=gestalt_api_general burst=30 nodelay;
        limit_conn gestalt_api_connections 20;
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Lineup evaluation is the only materially CPU-bound public endpoint.
    location = /api/matchups {
        limit_req zone=gestalt_api_matchups burst=10 nodelay;
        limit_conn gestalt_api_connections 8;
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml application/font-woff application/font-woff2;
}
