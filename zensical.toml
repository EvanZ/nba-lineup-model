[project]
site_name = "NBA Lineup Model"
site_description = "Data contracts, reconstruction algorithms, and modeling guides."
site_url = "https://evanz.github.io/nba-lineup-model/"
repo_url = "https://github.com/EvanZ/nba-lineup-model"
docs_dir = "docs"
site_dir = "site"
dev_addr = "127.0.0.1:8000"
watch = ["src/nba_lineup_model"]
extra_css = ["stylesheets/extra.css"]
extra_javascript = [
  "javascripts/mathjax.js",
  "https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js",
]
nav = [
  {"Home" = "index.md"},
  {"Getting started" = "getting-started.md"},
  {"Architecture" = [
    {"Overview" = "architecture/overview.md"},
    {"Data flow" = "architecture/data-flow.md"},
    {"Decisions" = [
      {"Decision log" = "architecture/decisions/index.md"},
      {"Direct NBA source data" = "architecture/decisions/0001-direct-nba-source.md"},
      {"Possessions and lineup segments" = "architecture/decisions/0002-possession-segments.md"},
      {"Validation-first processing" = "architecture/decisions/0003-validation-first.md"},
      {"Hybrid season storage" = "architecture/decisions/0004-hybrid-season-storage.md"},
      {"MLflow experiment index" = "architecture/decisions/0005-mlflow-experiment-index.md"},
      {"Stats V3-first historical archive" = "architecture/decisions/0006-historical-stats-v3-first.md"},
      {"Stats V3 play-by-play history boundary" = "architecture/decisions/0007-stats-v3-play-by-play-history-boundary.md"},
    ]},
  ]},
  {"Data contracts" = [
    {"Raw responses" = "data/raw-responses.md"},
    {"Historical source coverage" = "data/historical-source-coverage.md"},
    {"Season discovery" = "data/season-discovery.md"},
    {"Events" = "data/events.md"},
    {"Lineups" = "data/lineups.md"},
    {"Possessions" = "data/possessions.md"},
    {"Player bios" = "data/player-bios.md"},
    {"Player-season panel" = "data/player-season-panel.md"},
    {"RAPM modeling stints" = "data/modeling-stints.md"},
    {"RAPM base predictions" = "data/rapm-base-predictions.md"},
    {"Season catalog and storage" = "data/season-storage.md"},
    {"Cross-season audit" = "data/audit.md"},
  ]},
  {"Guides" = [
    {"Build and serve the docs" = "guides/documentation.md"},
    {"Use the Prefect UI" = "guides/prefect-ui.md"},
    {"Track experiments with MLflow" = "guides/mlflow.md"},
    {"Build one game" = "guides/build-game.md"},
    {"Fetch a season" = "guides/fetch-season.md"},
    {"Fetch historical Stats responses" = "guides/fetch-stats-history.md"},
    {"Process a season" = "guides/process-season.md"},
    {"Compact a season" = "guides/compact-season.md"},
    {"Collect player bios" = "guides/collect-player-bios.md"},
    {"Backfill historical seasons" = "guides/backfill-history.md"},
    {"Train RAPM baselines" = "guides/train-rapm.md"},
    {"Train the RAPM aging model" = "guides/train-aging.md"},
    {"Train age-informed prior RAPM" = "guides/train-aging-prior-rapm.md"},
    {"Train blended-prior RAPM" = "guides/train-blended-prior-rapm.md"},
    {"Train neural models" = "guides/train-neural.md"},
    {"Train RAPM + Transformer" = "guides/train-transformer.md"},
    {"Train CatBoost" = "guides/train-catboost.md"},
    {"Run cross-season audits" = "guides/cross-season-audit.md"},
  ]},
  {"Models" = [
    {"Overview" = "models/index.md"},
    {"Baseline methodology" = "models/baselines.md"},
    {"Bayesian RAPM methodology" = "models/bayesian-rapm.md"},
    {"RAPM Aging Model" = "models/aging-model.md"},
    {"Prior-Centered RAPM" = "models/prior-rapm.md"},
    {"Neural Networks" = "models/neural-networks.md"},
    {"Tree Models" = "models/tree-models.md"},
    {"Leaderboard" = "models/leaderboard.md"},
    {"2025-26 RAPM case study" = "models/2025-26-rapm-case-study.md"},
    {"2025-26 Bayesian RAPM case study" = "models/2025-26-bayesian-rapm-case-study.md"},
    {"Promoted rankings" = "models/rankings.md"},
    {"Modeling Roadmap" = "models/roadmap.md"},
  ]},
  {"API reference" = [
    {"Build pipeline" = "reference/build-game.md"},
    {"Ingestion" = "reference/ingestion.md"},
    {"Events" = "reference/events.md"},
    {"Lineups" = "reference/lineups.md"},
    {"Possessions" = "reference/possessions.md"},
    {"Player data" = "reference/players.md"},
    {"Modeling" = "reference/modeling.md"},
    {"Season data" = "reference/season.md"},
    {"Orchestration" = "reference/orchestration.md"},
    {"Experiment tracking" = "reference/tracking.md"},
    {"Audit" = "reference/audit.md"},
  ]},
]

[project.theme]
variant = "modern"
features = [
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.theme.icon]
logo = "fontawesome/solid/basketball"

[project.markdown_extensions.admonition]

[project.markdown_extensions.md_in_html]

[project.markdown_extensions.pymdownx.arithmatex]
generic = true

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  {name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format"},
]

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
inherited_members = true
members_order = "source"
show_source = false
