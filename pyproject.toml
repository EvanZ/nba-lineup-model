[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "ruff>=0.7.0",
]
docs = [
    "matplotlib>=3.9",
    "mkdocstrings-python>=2.0.5",
    "zensical>=0.0.51",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nba_lineup_model"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
