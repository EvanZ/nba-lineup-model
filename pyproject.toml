[project]
name = "nba-lineup-model"
version = "0.1.0"
description = "Direct NBA data ingestion and lineup modeling experiments."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "catboost>=1.2.7,<2",
    "httpx>=0.27.2",
    "joblib>=1.4",
    "pandas>=2.2.3",
    "prefect>=3.4,<4",
    "pydantic>=2.9.2",
    "pyarrow>=17.0.0",
    "scikit-learn>=1.5.2",
    "scipy>=1.14.1",
    "torch>=2.6",
    "lightning>=2.5,<3",
    "mlflow>=3.5,<4",
    "fastapi>=0.140.7",
    "uvicorn>=0.51.0",
]

