[project]
name = "nba-lineup-model"
version = "0.1.0"
description = "Direct NBA data ingestion and lineup modeling experiments."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "catboost>=1.2.7",
    "httpx>=0.27.2",
    "pandas>=2.2.3",
    "prefect>=3.4,<4",
    "pydantic>=2.9.2",
    "pyarrow>=17.0.0",
    "scikit-learn>=1.5.2",
]

[project.scripts]
nba-audit-games = "nba_lineup_model.audit.runner:main"
nba-build-game = "nba_lineup_model.build_game:main"
nba-compact-season = "nba_lineup_model.flows.compact_season:main"
nba-discover-season = "nba_lineup_model.season.discover:main"
nba-fetch-season = "nba_lineup_model.flows.fetch_season:main"
nba-import-catalog = "nba_lineup_model.season.catalog:main"
nba-process-season = "nba_lineup_model.flows.process_season:main"
nba-sample-audit = "nba_lineup_model.audit.sample:main"

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "ruff>=0.7.0",
]
docs = [
    "mkdocstrings-python>=2.0.5",
    "zensical>=0.0.51",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nba_lineup_model"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
