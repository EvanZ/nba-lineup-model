[project]
name = "nba-lineup-model"
version = "0.1.0"
description = "Direct NBA data ingestion and lineup modeling experiments."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "catboost>=1.2.7,<2",
    "httpx>=0.27.2",
    "joblib>=1.4",
    "pandas>=2.2.3",
    "prefect>=3.4,<4",
    "pydantic>=2.9.2",
    "pyarrow>=17.0.0",
    "scikit-learn>=1.5.2",
    "scipy>=1.14.1",
    "torch>=2.6",
    "lightning>=2.5,<3",
    "mlflow>=3.5,<4",
]

[project.scripts]
nba-audit-games = "nba_lineup_model.audit.runner:main"
nba-audit-history = "nba_lineup_model.audit.history:main"
nba-build-game = "nba_lineup_model.build_game:main"
nba-build-bayesian-rapm-case-study = "nba_lineup_model.modeling.bayesian_case_study:main"
nba-build-aging-curve-case-study = "nba_lineup_model.modeling.aging_curve:main"
nba-build-rapm-case-study = "nba_lineup_model.modeling.case_study:main"
nba-build-player-season-panel = "nba_lineup_model.modeling.player_history:main"
nba-backfill-history = "nba_lineup_model.flows.backfill_history:main"
nba-compact-season = "nba_lineup_model.flows.compact_season:main"
nba-discover-season = "nba_lineup_model.season.discover:main"
nba-fetch-player-bios = "nba_lineup_model.players.collect:main"
nba-fetch-season = "nba_lineup_model.flows.fetch_season:main"
nba-fetch-stats-history = "nba_lineup_model.flows.fetch_stats_history:main"
nba-import-catalog = "nba_lineup_model.season.catalog:main"
nba-evaluate-models = "nba_lineup_model.modeling.leaderboard:main"
nba-process-season = "nba_lineup_model.flows.process_season:main"
nba-sample-audit = "nba_lineup_model.audit.sample:main"
nba-sync-mlflow = "nba_lineup_model.tracking:main"
nba-diagnose-rapm = "nba_lineup_model.modeling.diagnostics:main"
nba-train-bayesian-rapm = "nba_lineup_model.modeling.bayesian:main"
nba-train-aging-model = "nba_lineup_model.modeling.aging:main"
nba-train-aging-prior-rapm = "nba_lineup_model.modeling.aging_prior_rapm:main"
nba-train-blended-prior-rapm = "nba_lineup_model.modeling.blended_prior_rapm:main"
nba-train-catboost = "nba_lineup_model.modeling.catboost:main"
nba-train-deep-sets = "nba_lineup_model.modeling.deep_sets:main"
nba-train-neural-rapm = "nba_lineup_model.modeling.neural:main"
nba-train-forward-lagged-rapm = "nba_lineup_model.modeling.prior_rapm:main"
nba-train-rapm = "nba_lineup_model.modeling.train:main"
nba-train-rapm-transformer = "nba_lineup_model.modeling.transformer:main"

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "ruff>=0.7.0",
]
docs = [
    "matplotlib>=3.9",
    "mkdocstrings-python>=2.0.5",
    "zensical>=0.0.51",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nba_lineup_model"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
