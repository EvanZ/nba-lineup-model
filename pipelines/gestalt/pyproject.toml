[project]
name = "gestalt-pipelines"
version = "0.1.0"
description = "Dagster code location for NBA GESTALT pipelines."
requires-python = ">=3.11"
dependencies = ["boto3==1.43.118", "dagster==1.13.26", "pypdf==6.18.0", "requests==2.34.2"]

[dependency-groups]
dev = ["pytest>=8.3.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gestalt_pipelines"]

[tool.dagster]
module_name = "gestalt_pipelines.definitions"
code_location_name = "nba_gestalt_pipelines"

[tool.pytest.ini_options]
testpaths = ["tests"]
